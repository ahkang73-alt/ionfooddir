<title>Memory Galaxy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Quicksand:wght@300;400;500;600;700&display=swap">
<style>
  body {
    background: #060a18;
    color: #d8d8f0;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    font-family: 'Quicksand', system-ui, sans-serif;
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .clock-wrap {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    text-align: center;
    padding-top: min(10vh, 60px);
    pointer-events: none;
  }

  .clock-time {
    font-family: 'Orbitron', monospace;
    font-size: clamp(2.8rem, 9vw, 5.5rem);
    font-weight: 700;
    letter-spacing: 0.06em;
    color: #e0e0f0;
    text-shadow: 0 0 40px rgba(120, 160, 255, 0.25), 0 2px 20px rgba(0, 0, 0, 0.5);
    font-variant-numeric: tabular-nums;
  }

  .clock-date {
    font-family: 'Quicksand', sans-serif;
    font-size: clamp(0.75rem, 2vw, 1.05rem);
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(200, 200, 230, 0.45);
    margin-top: 0.4rem;
  }
</style>

<canvas id="c"></canvas>

<div class="clock-wrap">
  <div class="clock-time" id="ct">00:00</div>
  <div class="clock-date" id="cd"></div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, dpr;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

/* ─── CLOCK ─── */
function updateClock() {
  const now = new Date();
  const h = now.getHours().toString().padStart(2, '0');
  const m = now.getMinutes().toString().padStart(2, '0');
  document.getElementById('ct').textContent = h + ':' + m;
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('cd').textContent = days[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate();
}
updateClock();
setInterval(updateClock, 5000);

/* ─── PARALLAX MOUSE ─── */
let mx = 0, my = 0;
document.addEventListener('mousemove', e => {
  mx = (e.clientX / W - 0.5) * 2;
  my = (e.clientY / H - 0.5) * 2;
});

/* ─── BACKGROUND STARS ─── */
const bgStars = [];
for (let i = 0; i < 350; i++) {
  bgStars.push({
    x: Math.random(), y: Math.random(),
    r: Math.random() * 1.4 + 0.2,
    phase: Math.random() * Math.PI * 2,
    speed: Math.random() * 0.015 + 0.003
  });
}

function drawBgStars(t) {
  for (const s of bgStars) {
    const a = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, 6.2832);
    ctx.fillStyle = 'rgba(210,210,240,' + a.toFixed(2) + ')';
    ctx.fill();
  }
}

/* ─── SHOOTING STARS ─── */
const shooters = [];
function spawnShooter() {
  shooters.push({
    x: Math.random() * W * 0.8 + W * 0.1,
    y: Math.random() * H * 0.3,
    vx: (2 + Math.random() * 3) * (Math.random() > 0.5 ? 1 : -1),
    vy: 1 + Math.random() * 2,
    life: 1, decay: 0.012 + Math.random() * 0.01,
    len: 30 + Math.random() * 40
  });
}

function drawShooters(dt) {
  if (Math.random() < 0.003) spawnShooter();
  for (let i = shooters.length - 1; i >= 0; i--) {
    const s = shooters[i];
    s.x += s.vx;
    s.y += s.vy;
    s.life -= s.decay;
    if (s.life <= 0) { shooters.splice(i, 1); continue; }
    const mag = Math.sqrt(s.vx * s.vx + s.vy * s.vy);
    const nx = -s.vx / mag, ny = -s.vy / mag;
    const grad = ctx.createLinearGradient(s.x, s.y, s.x + nx * s.len, s.y + ny * s.len);
    grad.addColorStop(0, 'rgba(220,230,255,' + (s.life * 0.9).toFixed(2) + ')');
    grad.addColorStop(1, 'rgba(220,230,255,0)');
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x + nx * s.len, s.y + ny * s.len);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(s.x, s.y, 2, 0, 6.2832);
    ctx.fillStyle = 'rgba(230,240,255,' + (s.life * 0.8).toFixed(2) + ')';
    ctx.fill();
  }
}

/* ─── GALAXY ─── */
const ARMS = 2;
const STARS_PER_ARM = 180;
const galaxyPts = [];

for (let arm = 0; arm < ARMS; arm++) {
  const base = (arm / ARMS) * Math.PI * 2;
  for (let i = 0; i < STARS_PER_ARM; i++) {
    const t = i / STARS_PER_ARM;
    const angle = base + t * Math.PI * 3.2;
    const dist = t * 0.48 + 0.04;
    const spread = (Math.random() - 0.5) * 0.06 * (0.5 + t);
    galaxyPts.push({
      a: angle + spread,
      d: dist + (Math.random() - 0.5) * 0.04,
      sz: Math.random() * 1.8 + 0.4,
      br: Math.random() * 0.5 + 0.4,
      hue: Math.random() > 0.75 ? (Math.random() > 0.5 ? '#b0a0d8' : '#80c8d8') : '#d0d0e8'
    });
  }
}
for (let i = 0; i < 90; i++) {
  galaxyPts.push({
    a: Math.random() * 6.2832,
    d: Math.random() * 0.07,
    sz: Math.random() * 1.2 + 0.5,
    br: Math.random() * 0.4 + 0.6,
    hue: Math.random() > 0.4 ? '#ffe8a0' : '#fff4d0'
  });
}

const memories = [
  { name: 'CeleVenus',    a: 0,          d: 0.72, col: '#e84393', sz: 7 },
  { name: 'ION Food Dir', a: Math.PI*0.38, d: 0.88, col: '#00d2ff', sz: 6 },
  { name: 'Lucky Draw',   a: Math.PI*0.82, d: 0.58, col: '#ffd54f', sz: 6 },
  { name: 'UGC Studio',   a: Math.PI*1.18, d: 0.78, col: '#a259ff', sz: 5 },
  { name: 'Brand Assets', a: Math.PI*1.42, d: 0.82, col: '#2e86ff', sz: 5 },
  { name: 'Promo Hub',    a: Math.PI*0.18, d: 0.48, col: '#ff6b3a', sz: 5 }
];

const connections = [[0,3],[1,4],[2,5],[0,2],[3,5]];

let gRot = 0;

function drawGalaxy(t) {
  gRot += 0.00025;
  const px = mx * 15, py = my * 8;
  const cx = W * 0.5 + px;
  const cy = H * 0.46 + py;
  const maxR = Math.min(W, H) * 0.32;

  // nebula clouds
  const n1 = ctx.createRadialGradient(cx - maxR*0.25, cy - maxR*0.1, 0, cx - maxR*0.25, cy - maxR*0.1, maxR*0.65);
  n1.addColorStop(0, 'rgba(120,40,180,0.12)');
  n1.addColorStop(0.6, 'rgba(120,40,180,0.03)');
  n1.addColorStop(1, 'rgba(120,40,180,0)');
  ctx.fillStyle = n1;
  ctx.fillRect(0, 0, W, H);

  const n2 = ctx.createRadialGradient(cx + maxR*0.3, cy + maxR*0.15, 0, cx + maxR*0.3, cy + maxR*0.15, maxR*0.55);
  n2.addColorStop(0, 'rgba(30,100,255,0.10)');
  n2.addColorStop(0.5, 'rgba(30,100,255,0.03)');
  n2.addColorStop(1, 'rgba(30,100,255,0)');
  ctx.fillStyle = n2;
  ctx.fillRect(0, 0, W, H);

  const n3 = ctx.createRadialGradient(cx + maxR*0.1, cy - maxR*0.2, 0, cx + maxR*0.1, cy - maxR*0.2, maxR*0.4);
  n3.addColorStop(0, 'rgba(232,67,147,0.07)');
  n3.addColorStop(1, 'rgba(232,67,147,0)');
  ctx.fillStyle = n3;
  ctx.fillRect(0, 0, W, H);

  // core glow
  const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR*0.14);
  core.addColorStop(0, 'rgba(255,220,120,0.30)');
  core.addColorStop(0.4, 'rgba(255,220,120,0.08)');
  core.addColorStop(1, 'rgba(255,220,120,0)');
  ctx.fillStyle = core;
  ctx.fillRect(cx - maxR*0.2, cy - maxR*0.2, maxR*0.4, maxR*0.4);

  // galaxy spiral stars
  for (const s of galaxyPts) {
    const angle = s.a + gRot;
    const r = s.d * maxR;
    const x = cx + Math.cos(angle) * r * 1.25;
    const y = cy + Math.sin(angle) * r * 0.85;
    ctx.globalAlpha = s.br * 0.75;
    ctx.beginPath();
    ctx.arc(x, y, s.sz, 0, 6.2832);
    ctx.fillStyle = s.hue;
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // constellation lines between memories
  ctx.strokeStyle = 'rgba(180,180,220,0.06)';
  ctx.lineWidth = 1;
  for (const [a, b] of connections) {
    const ma = memories[a], mb = memories[b];
    const aa = ma.a + gRot * 1.4, ab = mb.a + gRot * 1.4;
    const xa = cx + Math.cos(aa) * ma.d * maxR * 1.25;
    const ya = cy + Math.sin(aa) * ma.d * maxR * 0.85;
    const xb = cx + Math.cos(ab) * mb.d * maxR * 1.25;
    const yb = cy + Math.sin(ab) * mb.d * maxR * 0.85;
    ctx.beginPath();
    ctx.moveTo(xa, ya);
    ctx.lineTo(xb, yb);
    ctx.stroke();
  }

  // memory nodes
  for (let i = 0; i < memories.length; i++) {
    const m = memories[i];
    const angle = m.a + gRot * 1.4;
    const x = cx + Math.cos(angle) * m.d * maxR * 1.25;
    const y = cy + Math.sin(angle) * m.d * maxR * 0.85;
    const pulse = m.sz * (1 + Math.sin(t * 0.0018 + i * 1.2) * 0.15);

    // outer glow
    const glow = ctx.createRadialGradient(x, y, 0, x, y, pulse * 4.5);
    glow.addColorStop(0, m.col + '55');
    glow.addColorStop(0.4, m.col + '18');
    glow.addColorStop(1, m.col + '00');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, pulse * 4.5, 0, 6.2832);
    ctx.fill();

    // bright core
    ctx.beginPath();
    ctx.arc(x, y, pulse, 0, 6.2832);
    ctx.fillStyle = m.col;
    ctx.fill();

    // inner bright spot
    ctx.beginPath();
    ctx.arc(x - pulse * 0.2, y - pulse * 0.2, pulse * 0.4, 0, 6.2832);
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fill();

    // label
    ctx.font = '600 ' + Math.max(10, Math.min(12, W * 0.014)) + 'px Quicksand, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(210,210,235,0.65)';
    ctx.fillText(m.name, x, y + pulse + 16);
  }
}

/* ─── VIGNETTE ─── */
function drawVignette() {
  const g = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.25, W/2, H/2, Math.max(W,H)*0.85);
  g.addColorStop(0, 'rgba(6,10,24,0)');
  g.addColorStop(1, 'rgba(6,10,24,0.65)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/* ─── GINGER CAT ─── */
const CAT_COLORS = {
  body: '#e38a30',
  bodyLight: '#f0a348',
  bodyDark: '#c46e1e',
  belly: '#f5c88a',
  stripe: '#b86020',
  nose: '#e8908a',
  earInner: '#e8a098',
  eye: '#68b840',
  eyeDark: '#121828',
  whisker: 'rgba(220,220,240,0.5)',
  pawPad: '#c09070'
};

class GingerCat {
  constructor() {
    this.x = W * 0.45;
    this.gy = H - 50;
    this.state = 'sitting';
    this.prev = null;
    this.trans = 1;
    this.dir = 1;
    this.walkPhase = 0;
    this.walkSpeed = 28;
    this.tailPhase = 0;
    this.breathPhase = 0;
    this.blinkT = 3 + Math.random() * 4;
    this.blink = false;
    this.blinkDur = 0.18;
    this.earTw = 0;
    this.stateT = 6 + Math.random() * 8;
    this.purr = 0;
  }

  get sc() { return Math.min(W, H) / 850 * 1.05; }

  update(dt) {
    this.tailPhase += dt * 1.8;
    this.breathPhase += dt * 1.2;
    this.purr += dt;

    // blink
    this.blinkT -= dt;
    if (this.blinkT <= 0) {
      if (!this.blink) { this.blink = true; this.blinkT = this.blinkDur; }
      else { this.blink = false; this.blinkT = 2 + Math.random() * 5; }
    }

    // ear twitch
    if (this.earTw > 0) this.earTw = Math.max(0, this.earTw - dt * 6);
    else if (Math.random() < 0.004) this.earTw = 1;

    // state-specific
    if (this.state === 'walking') {
      this.walkPhase += dt * 7;
      this.x += this.walkSpeed * this.dir * dt * this.sc;
      if (this.x > W - 80) this.dir = -1;
      if (this.x < 80) this.dir = 1;
    }

    // transition
    if (this.trans < 1) this.trans = Math.min(1, this.trans + dt * 2.5);

    // state timer
    this.stateT -= dt;
    if (this.stateT <= 0) this.changeState();
    this.gy = H - 50;
  }

  changeState() {
    const wt = { walking:{sitting:0.65,sleeping:0.35}, sitting:{walking:0.5,sleeping:0.5}, sleeping:{sitting:0.8,walking:0.2} };
    const w = wt[this.state];
    const r = Math.random();
    let c = 0;
    for (const [st, p] of Object.entries(w)) {
      c += p;
      if (r < c) {
        this.prev = this.state;
        this.state = st;
        this.trans = 0;
        if (st === 'walking') this.dir = Math.random() > 0.5 ? 1 : -1;
        this.stateT = st === 'sleeping' ? 12+Math.random()*18 : st === 'sitting' ? 6+Math.random()*12 : 5+Math.random()*8;
        break;
      }
    }
  }

  draw(ctx) {
    ctx.save();
    ctx.translate(this.x, this.gy);

    // ground glow
    const gg = ctx.createRadialGradient(0, 2, 0, 0, 2, 50*this.sc);
    gg.addColorStop(0, 'rgba(227,138,48,0.10)');
    gg.addColorStop(1, 'rgba(227,138,48,0)');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.ellipse(0, 2, 50*this.sc, 8*this.sc, 0, 0, 6.2832);
    ctx.fill();

    if (this.trans < 1 && this.prev) {
      ctx.globalAlpha = 1 - this.trans;
      this.drawPose(ctx, this.prev);
      ctx.globalAlpha = this.trans;
      this.drawPose(ctx, this.state);
      ctx.globalAlpha = 1;
    } else {
      this.drawPose(ctx, this.state);
    }
    ctx.restore();
  }

  drawPose(ctx, st) {
    if (st === 'walking') this.drawWalk(ctx);
    else if (st === 'sitting') this.drawSit(ctx);
    else this.drawSleep(ctx);
  }

  drawWalk(ctx) {
    const s = this.sc;
    ctx.save();
    ctx.scale(this.dir, 1);

    const bob = Math.sin(this.walkPhase) * 1.5 * s;

    // tail
    ctx.beginPath();
    const tw = Math.sin(this.tailPhase) * 12 * s;
    ctx.moveTo(-28*s, (-18+bob)*s);
    ctx.bezierCurveTo(-36*s, (-12+bob)*s, -44*s + tw*0.5, (-32+bob)*s, -40*s + tw, (-42+bob)*s);
    ctx.lineWidth = 5*s;
    ctx.lineCap = 'round';
    ctx.strokeStyle = CAT_COLORS.body;
    ctx.stroke();
    // tail stripes
    ctx.lineWidth = 5*s;
    ctx.setLineDash([3*s, 5*s]);
    ctx.strokeStyle = CAT_COLORS.stripe;
    ctx.stroke();
    ctx.setLineDash([]);

    // back legs
    const legF = this.walkPhase;
    this.drawWalkLeg(ctx, -16*s, -7*s, Math.sin(legF)*14*s, s, bob);
    this.drawWalkLeg(ctx, -8*s, -7*s, Math.sin(legF+Math.PI)*14*s, s, bob);

    // body
    ctx.beginPath();
    ctx.ellipse(0, (-20+bob)*s, 30*s, 13*s, 0, 0, 6.2832);
    const bGrad = ctx.createLinearGradient(0, (-33+bob)*s, 0, (-7+bob)*s);
    bGrad.addColorStop(0, CAT_COLORS.bodyLight);
    bGrad.addColorStop(1, CAT_COLORS.bodyDark);
    ctx.fillStyle = bGrad;
    ctx.fill();

    // belly highlight
    ctx.beginPath();
    ctx.ellipse(2*s, (-14+bob)*s, 18*s, 6*s, 0.1, 0, 6.2832);
    ctx.fillStyle = CAT_COLORS.belly + '60';
    ctx.fill();

    // body stripes
    for (let i = 0; i < 4; i++) {
      const sx = -10*s + i * 8*s;
      ctx.beginPath();
      ctx.moveTo(sx, (-30+bob)*s);
      ctx.quadraticCurveTo(sx+2*s, (-20+bob)*s, sx-1*s, (-10+bob)*s);
      ctx.lineWidth = 2*s;
      ctx.strokeStyle = CAT_COLORS.stripe + '50';
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    // front legs
    this.drawWalkLeg(ctx, 14*s, -7*s, Math.sin(legF+Math.PI)*14*s, s, bob);
    this.drawWalkLeg(ctx, 22*s, -7*s, Math.sin(legF)*14*s, s, bob);

    // neck/head connection
    ctx.beginPath();
    ctx.ellipse(24*s, (-24+bob)*s, 10*s, 8*s, 0.2, 0, 6.2832);
    ctx.fillStyle = CAT_COLORS.body;
    ctx.fill();

    // head
    const hx = 28*s, hy = (-32+bob)*s;
    ctx.beginPath();
    ctx.arc(hx, hy, 13*s, 0, 6.2832);
    const hGrad = ctx.createRadialGradient(hx-3*s, hy-3*s, 0, hx, hy, 13*s);
    hGrad.addColorStop(0, CAT_COLORS.bodyLight);
    hGrad.addColorStop(1, CAT_COLORS.body);
    ctx.fillStyle = hGrad;
    ctx.fill();

    // cheeks (slightly wider face)
    ctx.beginPath();
    ctx.ellipse(hx+2*s, hy+4*s, 12*s, 8*s, 0, 0, 6.2832);
    ctx.fillStyle = CAT_COLORS.body;
    ctx.fill();

    // ears
    const earTilt = this.earTw * 3;
    this.drawEar(ctx, hx-7*s, hy-10*s, -0.3 - earTilt*0.05, s);
    this.drawEar(ctx, hx+5*s, hy-11*s, 0.3 + earTilt*0.05, s);

    // M marking on forehead
    ctx.beginPath();
    ctx.moveTo(hx-5*s, hy-6*s);
    ctx.lineTo(hx-2*s, hy-9*s);
    ctx.lineTo(hx, hy-6*s);
    ctx.lineTo(hx+2*s, hy-9*s);
    ctx.lineTo(hx+5*s, hy-6*s);
    ctx.strokeStyle = CAT_COLORS.stripe + '60';
    ctx.lineWidth = 1.5*s;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();

    // eye
    if (this.blink) {
      ctx.beginPath();
      ctx.moveTo(hx+5*s, hy-1*s);
      ctx.lineTo(hx+11*s, hy-1*s);
      ctx.strokeStyle = CAT_COLORS.eyeDark;
      ctx.lineWidth = 1.5*s;
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.ellipse(hx+8*s, hy-1*s, 3*s, 3.5*s, 0, 0, 6.2832);
      ctx.fillStyle = CAT_COLORS.eye;
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(hx+8.5*s, hy-1*s, 1.5*s, 3*s, 0, 0, 6.2832);
      ctx.fillStyle = CAT_COLORS.eyeDark;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(hx+7*s, hy-2.5*s, 1*s, 0, 6.2832);
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fill();
    }

    // nose
    ctx.beginPath();
    ctx.moveTo(hx+12*s, hy+2*s);
    ctx.lineTo(hx+10.5*s, hy+4*s);
    ctx.lineTo(hx+13.5*s, hy+4*s);
    ctx.closePath();
    ctx.fillStyle = CAT_COLORS.nose;
    ctx.fill();

    // mouth
    ctx.beginPath();
    ctx.moveTo(hx+12*s, hy+4*s);
    ctx.lineTo(hx+12*s, hy+5.5*s);
    ctx.quadraticCurveTo(hx+10*s, hy+6*s, hx+9*s, hy+5*s);
    ctx.strokeStyle = CAT_COLORS.stripe + '40';
    ctx.lineWidth = 1*s;
    ctx.stroke();

    // whiskers
    ctx.strokeStyle = CAT_COLORS.whisker;
    ctx.lineWidth = 0.8*s;
    for (let i = 0; i < 3; i++) {
      const wy = hy + 2*s + i * 2.5*s;
      const wa = -0.15 + i * 0.15;
      ctx.beginPath();
      ctx.moveTo(hx+11*s, wy);
      ctx.lineTo(hx+26*s, wy + Math.sin(wa + this.tailPhase*0.3)*2*s);
      ctx.stroke();
    }

    ctx.restore();
  }

  drawWalkLeg(ctx, lx, ly, swing, s, bob) {
    const topY = (ly + bob) * 1;
    const footX = lx + swing * 0.6;
    const footY = 0;
    const kneeX = lx + swing * 0.3;
    const kneeY = topY + (footY - topY) * 0.5 + Math.abs(swing) * 0.15;

    ctx.beginPath();
    ctx.moveTo(lx, topY);
    ctx.quadraticCurveTo(kneeX, kneeY, footX, footY);
    ctx.lineWidth = 5 * s;
    ctx.lineCap = 'round';
    ctx.strokeStyle = CAT_COLORS.body;
    ctx.stroke();

    // paw
    ctx.beginPath();
    ctx.ellipse(footX, footY + 1*s, 3.5*s, 2*s, 0, 0, 6.2832);
    ctx.fillStyle = CAT_COLORS.bodyDark;
    ctx.fill();
  }

  drawEar(ctx, ex, ey, angle, s) {
    ctx.save();
    ctx.translate(ex, ey);
    ctx.rotate(angle);
    // outer ear
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-4*s, -14*s);
    ctx.lineTo(6*s, -2*s);
    ctx.closePath();
    ctx.fillStyle = CAT_COLORS.body;
    ctx.fill();
    // inner ear
    ctx.beginPath();
    ctx.moveTo(0, -1*s);
    ctx.lineTo(-3*s, -11*s);
    ctx.lineTo(4*s, -2*s);
    ctx.closePath();
    ctx.fillStyle = CAT_COLORS.earInner;
    ctx.fill();
    ctx.restore();
  }

  drawSit(ctx) {
    const s = this.sc;
    const br = Math.sin(this.breathPhase) * 1.5 * s;

    // tail curving from the right side
    ctx.beginPath();
    const tw = Math.sin(this.tailPhase * 0.7) * 6 * s;
    ctx.moveTo(22*s, -5*s);
    ctx.bezierCurveTo(32*s, -8*s, 36*s+tw, -18*s, 28*s+tw, -22*s);
    ctx.lineWidth = 5*s;
    ctx.lineCap = 'round';
    ctx.strokeStyle = CAT_COLORS.body;
    ctx.stroke();
    ctx.setLineDash([3*s, 6*s]);
    ctx.strokeStyle = CAT_COLORS.stripe;
    ctx.stroke();
    ctx.setLineDash([]);

    // body - upright pear shape
    ctx.beginPath();
    ctx.moveTo(-18*s, 0);
    ctx.bezierCurveTo(-22*s, -12*s, -20*s-br*0.3, -28*s, -14*s, -36*s);
    ctx.bezierCurveTo(-8*s, -44*s, 8*s, -44*s, 14*s, -36*s);
    ctx.bezierCurveTo(20*s+br*0.3, -28*s, 22*s, -12*s, 18*s, 0);
    ctx.closePath();
    const sitGrad = ctx.createLinearGradient(0, -44*s, 0, 0);
    sitGrad.addColorStop(0, CAT_COLORS.bodyLight);
    sitGrad.addColorStop(0.6, CAT_COLORS.body);
    sitGrad.addColorStop(1, CAT_COLORS.bodyDark);
    ctx.fillStyle = sitGrad;
    ctx.fill();

    // chest/belly
    ctx.beginPath();
    ctx.ellipse(0, -12*s, 10*s, 14*s, 0, 0.3, Math.PI-0.3);
    ctx.fillStyle = CAT_COLORS.belly + '50';
    ctx.fill();

    // body stripes
    for (let i = 0; i < 3; i++) {
      const sx = -6*s + i * 6*s;
      ctx.beginPath();
      ctx.moveTo(sx, -38*s);
      ctx.quadraticCurveTo(sx+2*s, -30*s, sx-1*s, -22*s);
      ctx.lineWidth = 1.8*s;
      ctx.strokeStyle = CAT_COLORS.stripe + '45';
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    // front paws
    ctx.beginPath();
    ctx.ellipse(-7*s, -1*s, 5*s, 3*s, -0.1, 0, 6.2832);
    ctx.fillStyle = CAT_COLORS.body;
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(7*s, -1*s, 5*s, 3*s, 0.1, 0, 6.2832);
    ctx.fillStyle = CAT_COLORS.body;
    ctx.fill();
    // paw details
    ctx.beginPath();
    ctx.ellipse(-7*s, 0, 4*s, 2*s, 0, 0, 6.2832);
    ctx.fillStyle = CAT_COLORS.bodyDark + '60';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(7*s, 0, 4*s, 2*s, 0, 0, 6.2832);
    ctx.fillStyle = CAT_COLORS.bodyDark + '60';
    ctx.fill();

    // head (looking up)
    const headY = -42*s + br*0.5;
    const tiltBack = -0.12;
    ctx.save();
    ctx.translate(0, headY);
    ctx.rotate(tiltBack);

    // head shape
    ctx.beginPath();
    ctx.arc(0, 0, 14*s, 0, 6.2832);
    const hg = ctx.createRadialGradient(-3*s, -3*s, 0, 0, 0, 14*s);
    hg.addColorStop(0, CAT_COLORS.bodyLight);
    hg.addColorStop(1, CAT_COLORS.body);
    ctx.fillStyle = hg;
    ctx.fill();

    // cheek fluffs
    ctx.beginPath();
    ctx.ellipse(-10*s, 5*s, 7*s, 5*s, -0.2, 0, 6.2832);
    ctx.fillStyle = CAT_COLORS.body;
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(10*s, 5*s, 7*s, 5*s, 0.2, 0, 6.2832);
    ctx.fillStyle = CAT_COLORS.body;
    ctx.fill();

    // ears
    this.drawEar(ctx, -9*s, -10*s, -0.35 - this.earTw*0.06, s);
    this.drawEar(ctx, 9*s, -10*s, 0.35 + this.earTw*0.06, s);

    // M marking
    ctx.beginPath();
    ctx.moveTo(-6*s, -5*s);
    ctx.lineTo(-3*s, -9*s);
    ctx.lineTo(0, -5*s);
    ctx.lineTo(3*s, -9*s);
    ctx.lineTo(6*s, -5*s);
    ctx.strokeStyle = CAT_COLORS.stripe + '55';
    ctx.lineWidth = 1.5*s;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();

    // eyes (looking up)
    if (this.blink) {
      // closed eyes - happy arcs
      ctx.beginPath();
      ctx.arc(-5*s, 0, 3*s, Math.PI+0.3, -0.3);
      ctx.strokeStyle = CAT_COLORS.eyeDark;
      ctx.lineWidth = 1.5*s;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(5*s, 0, 3*s, Math.PI+0.3, -0.3);
      ctx.stroke();
    } else {
      // left eye
      ctx.beginPath();
      ctx.ellipse(-5*s, 0, 3.5*s, 4*s, 0, 0, 6.2832);
      ctx.fillStyle = CAT_COLORS.eye;
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(-5*s, 0, 1.8*s, 3.5*s, 0, 0, 6.2832);
      ctx.fillStyle = CAT_COLORS.eyeDark;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(-6.5*s, -1.5*s, 1*s, 0, 6.2832);
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.fill();

      // right eye
      ctx.beginPath();
      ctx.ellipse(5*s, 0, 3.5*s, 4*s, 0, 0, 6.2832);
      ctx.fillStyle = CAT_COLORS.eye;
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(5*s, 0, 1.8*s, 3.5*s, 0, 0, 6.2832);
      ctx.fillStyle = CAT_COLORS.eyeDark;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(3.5*s, -1.5*s, 1*s, 0, 6.2832);
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.fill();
    }

    // nose
    ctx.beginPath();
    ctx.moveTo(0, 3*s);
    ctx.lineTo(-2*s, 5.5*s);
    ctx.lineTo(2*s, 5.5*s);
    ctx.closePath();
    ctx.fillStyle = CAT_COLORS.nose;
    ctx.fill();

    // mouth
    ctx.beginPath();
    ctx.moveTo(0, 5.5*s);
    ctx.lineTo(0, 7*s);
    ctx.moveTo(0, 7*s);
    ctx.quadraticCurveTo(-3*s, 8*s, -5*s, 7*s);
    ctx.moveTo(0, 7*s);
    ctx.quadraticCurveTo(3*s, 8*s, 5*s, 7*s);
    ctx.strokeStyle = CAT_COLORS.stripe + '40';
    ctx.lineWidth = 1*s;
    ctx.lineCap = 'round';
    ctx.stroke();

    // whiskers
    ctx.strokeStyle = CAT_COLORS.whisker;
    ctx.lineWidth = 0.7*s;
    const ww = Math.sin(this.tailPhase*0.4) * 2 * s;
    for (let i = 0; i < 3; i++) {
      const wy = 4*s + i * 2*s;
      // left
      ctx.beginPath();
      ctx.moveTo(-4*s, wy);
      ctx.lineTo(-22*s, wy - 3*s + i*2*s + ww);
      ctx.stroke();
      // right
      ctx.beginPath();
      ctx.moveTo(4*s, wy);
      ctx.lineTo(22*s, wy - 3*s + i*2*s - ww);
      ctx.stroke();
    }

    ctx.restore();
  }

  drawSleep(ctx) {
    const s = this.sc;
    const br = Math.sin(this.breathPhase) * 2 * s;

    // sleeping cat - curled up on its side
    ctx.save();

    // body - round curled shape
    ctx.beginPath();
    ctx.ellipse(0, -12*s, (24+br*0.3)*s, (12+br*0.5)*s, 0.05, 0, 6.2832);
    const slGrad = ctx.createRadialGradient(-5*s, -15*s, 0, 0, -12*s, 24*s);
    slGrad.addColorStop(0, CAT_COLORS.bodyLight);
    slGrad.addColorStop(1, CAT_COLORS.body);
    ctx.fillStyle = slGrad;
    ctx.fill();

    // belly showing
    ctx.beginPath();
    ctx.ellipse(4*s, -6*s, 14*s, 6*s, 0.1, 0, Math.PI);
    ctx.fillStyle = CAT_COLORS.belly + '40';
    ctx.fill();

    // stripes on body
    for (let i = 0; i < 3; i++) {
      const sx = -8*s + i * 8*s;
      ctx.beginPath();
      ctx.ellipse(sx, -14*s, 1*s, 5*s, 0.2+i*0.1, 0, 6.2832);
      ctx.fillStyle = CAT_COLORS.stripe + '35';
      ctx.fill();
    }

    // tail wrapped around
    ctx.beginPath();
    ctx.moveTo(20*s, -8*s);
    ctx.bezierCurveTo(26*s, -4*s, 24*s, 2*s, 14*s, 0);
    ctx.bezierCurveTo(8*s, -2*s, 0, -2*s, -4*s, -4*s);
    ctx.lineWidth = 5*s;
    ctx.lineCap = 'round';
    ctx.strokeStyle = CAT_COLORS.body;
    ctx.stroke();
    ctx.setLineDash([3*s, 5*s]);
    ctx.strokeStyle = CAT_COLORS.stripe + '50';
    ctx.stroke();
    ctx.setLineDash([]);

    // head - tucked to side
    const hx = -16*s, hy = -16*s;
    ctx.beginPath();
    ctx.arc(hx, hy, 10*s, 0, 6.2832);
    ctx.fillStyle = CAT_COLORS.body;
    ctx.fill();

    // ear tips visible
    this.drawEar(ctx, hx-5*s, hy-7*s, -0.4, s*0.8);
    this.drawEar(ctx, hx+4*s, hy-8*s, 0.2, s*0.8);

    // closed eyes - peaceful arcs
    ctx.beginPath();
    ctx.arc(hx-3*s, hy+1*s, 2*s, Math.PI+0.3, -0.3);
    ctx.strokeStyle = CAT_COLORS.eyeDark;
    ctx.lineWidth = 1.2*s;
    ctx.stroke();

    // nose
    ctx.beginPath();
    ctx.arc(hx-7*s, hy+3*s, 1.5*s, 0, 6.2832);
    ctx.fillStyle = CAT_COLORS.nose + '80';
    ctx.fill();

    // paws tucked under
    ctx.beginPath();
    ctx.ellipse(-20*s, -3*s, 4*s, 2.5*s, -0.2, 0, 6.2832);
    ctx.fillStyle = CAT_COLORS.bodyDark;
    ctx.fill();

    // Zzz
    const zAlpha = 0.2 + 0.2 * Math.sin(this.breathPhase * 0.8);
    ctx.font = (10*s) + 'px Quicksand';
    ctx.fillStyle = 'rgba(200,200,230,' + zAlpha.toFixed(2) + ')';
    ctx.fillText('z', hx - 5*s, hy - 16*s + Math.sin(this.breathPhase)*3*s);
    ctx.font = (8*s) + 'px Quicksand';
    ctx.fillText('z', hx - 1*s, hy - 22*s + Math.sin(this.breathPhase+1)*2*s);
    ctx.font = (6*s) + 'px Quicksand';
    ctx.fillText('z', hx + 2*s, hy - 26*s + Math.sin(this.breathPhase+2)*2*s);

    ctx.restore();
  }
}

const cat = new GingerCat();

/* ─── MAIN LOOP ─── */
let last = 0;
function frame(ts) {
  const dt = Math.min((ts - last) / 1000, 0.1);
  last = ts;

  ctx.clearRect(0, 0, W, H);

  // background
  ctx.fillStyle = '#060a18';
  ctx.fillRect(0, 0, W, H);

  drawBgStars(ts);
  drawGalaxy(ts);
  drawShooters(dt);
  drawVignette();

  cat.update(dt);
  cat.draw(ctx);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
